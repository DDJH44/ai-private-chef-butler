[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "privatecook"
version = "1.0.0"
description = "AI 私人厨师"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.48",
    "sqlalchemy>=2.0",
    "pymysql>=1.2",
    "langchain>=1.3",
    "langchain-core>=1.4",
    "langchain-openai>=1.2",
    "langchain-anthropic>=1.4",
    "langgraph>=1.2",
    "langgraph-checkpoint>=4.1",
    "langgraph-checkpoint-mysql>=3.0",
    "langgraph-prebuilt>=1.1",
    "python-jose>=3.5",
    "bcrypt>=5.0",
    "python-dotenv>=1.2",
    "httpx>=0.28",
    "httpx-sse>=0.4",
    "cryptography>=48",
    "aiohttp>=3.13",
    "requests>=2.32",
    "chromadb>=1.5",
    "onnxruntime>=1.26",
    "openai>=2.38",
    "python-multipart>=0.0.30",
]

[project.optional-dependencies]
oss = ["oss2"]
